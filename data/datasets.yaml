# AgriParcel-MS (Multi-Source Agricultural Parcel Collection): farmland parcel instance segmentation.
# Split paths are relative to the directory containing this YAML file.
# Omit `path` so Ultralytics uses this directory as the dataset root.
train: images/train
val: images/val
test: images/test

# number of classes
nc: 1

# class names
names: ['field']
